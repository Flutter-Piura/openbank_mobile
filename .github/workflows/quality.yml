name: Mobile quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mobile-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --coverage
      - name: Download verified MobileLab
        env:
          MOBILELAB_SHA256: 263305e2a0168d01af3334b5a62029e85bf0b319c20d343b35f4b3573459f953
          MOBILELAB_VERSION: 1.1.0
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/mobilelab" \
            "https://github.com/GianSandoval5/MobileLab/releases/download/v${MOBILELAB_VERSION}/mobilelab-linux-amd64"
          echo "${MOBILELAB_SHA256}  $RUNNER_TEMP/mobilelab" | sha256sum --check
          chmod +x "$RUNNER_TEMP/mobilelab"
      - name: Validate MobileLab sandbox
        run: |
          "$RUNNER_TEMP/mobilelab" doctor
          "$RUNNER_TEMP/mobilelab" scenario list
